<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Room</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #f2f2f2;
  }
  header {
    background: #fff;
    border-bottom: 1px solid #ccc;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .who {
    font-size: 14px;
  }
  header .who b { }
  header .actions button {
    margin-left: 6px;
    font-size: 13px;
    padding: 5px 10px;
    cursor: pointer;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .msg {
    background: #fff;
    border: 1px solid #ddd;
    padding: 6px 10px;
    max-width: 70%;
    align-self: flex-start;
  }
  .msg.mine {
    align-self: flex-end;
    background: #e6f0ff;
  }
  .msg .meta {
    font-size: 11px;
    color: #777;
    margin-bottom: 2px;
  }
  .msg .meta b {
    color: #333;
  }
  .msg .text {
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg .admin-controls {
    margin-top: 4px;
  }
  .msg .admin-controls button {
    font-size: 11px;
    padding: 2px 6px;
    margin-right: 4px;
    cursor: pointer;
  }

  #compose {
    display: flex;
    border-top: 1px solid #ccc;
    background: #fff;
    padding: 10px;
    gap: 8px;
  }
  #compose input {
    flex: 1;
    font-size: 15px;
    padding: 8px;
  }
  #compose button {
    font-size: 15px;
    padding: 8px 16px;
    cursor: pointer;
  }

  #settings-panel {
    display: none;
    position: fixed;
    top: 50px;
    right: 14px;
    background: #fff;
    border: 1px solid #ccc;
    padding: 14px;
    width: 260px;
    z-index: 10;
  }
  #settings-panel input {
    width: 100%;
    padding: 6px;
    font-size: 14px;
    margin: 6px 0;
  }
  #settings-panel button {
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  #settings-status {
    font-size: 12px;
    color: #666;
    min-height: 14px;
  }
</style>
</head>
<body>

<header>
  <div class="who">Signed in as <b id="me-username">...</b></div>
  <div class="actions">
    <button id="settings-btn">Settings</button>
    <button id="signout-btn">Sign out</button>
  </div>
</header>

<div id="settings-panel">
  <div><label>Change username</label></div>
  <input id="new-username" type="text" maxlength="20">
  <button id="save-settings-btn">Save</button>
  <button id="close-settings-btn">Close</button>
  <div id="settings-status"></div>
</div>

<div id="messages"></div>

<form id="compose">
  <input id="msg-input" type="text" placeholder="Type a message..." autocomplete="off" maxlength="1000">
  <button type="submit">Send</button>
</form>

<script type="module">
import { auth, db, ADMIN_EMAIL } from "./firebase-config.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  doc,
  getDoc,
  updateDoc,
  setDoc,
  deleteDoc,
  collection,
  addDoc,
  query,
  where,
  getDocs,
  orderBy,
  limit,
  onSnapshot,
  serverTimestamp,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let currentUser = null;
let currentUsername = null;
let isAdmin = false;

const messagesEl = document.getElementById("messages");
const meUsernameEl = document.getElementById("me-username");
const composeForm = document.getElementById("compose");
const msgInput = document.getElementById("msg-input");
const signoutBtn = document.getElementById("signout-btn");

const settingsBtn = document.getElementById("settings-btn");
const settingsPanel = document.getElementById("settings-panel");
const closeSettingsBtn = document.getElementById("close-settings-btn");
const saveSettingsBtn = document.getElementById("save-settings-btn");
const newUsernameInput = document.getElementById("new-username");
const settingsStatus = document.getElementById("settings-status");

// ---- Auth / access gate ----
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "index.html";
    return;
  }
  currentUser = user;
  isAdmin = user.email === ADMIN_EMAIL;

  if (!isAdmin) {
    const banSnap = await getDoc(doc(db, "bans", user.uid));
    if (banSnap.exists()) {
      window.location.href = "banned.html";
      return;
    }
  }

  const userSnap = await getDoc(doc(db, "users", user.uid));
  if (!userSnap.exists() || !userSnap.data().username) {
    window.location.href = "index.html";
    return;
  }

  currentUsername = userSnap.data().username;
  meUsernameEl.textContent = currentUsername + (isAdmin ? " (admin)" : "");
  newUsernameInput.value = currentUsername;

  startMessageListener();
});

signoutBtn.addEventListener("click", () => signOut(auth));

// ---- Settings / change username ----
settingsBtn.addEventListener("click", () => {
  settingsPanel.style.display = "block";
});
closeSettingsBtn.addEventListener("click", () => {
  settingsPanel.style.display = "none";
  settingsStatus.textContent = "";
});

saveSettingsBtn.addEventListener("click", async () => {
  const name = newUsernameInput.value.trim();
  if (!/^[a-zA-Z0-9_]{3,20}$/.test(name)) {
    settingsStatus.textContent = "3-20 chars: letters, numbers, underscores only.";
    return;
  }
  settingsStatus.textContent = "Saving...";

  const q = query(collection(db, "users"), where("username", "==", name));
  const snap = await getDocs(q);
  const taken = snap.docs.some((d) => d.id !== currentUser.uid);
  if (taken) {
    settingsStatus.textContent = "That username is already taken.";
    return;
  }

  await updateDoc(doc(db, "users", currentUser.uid), { username: name });
  currentUsername = name;
  meUsernameEl.textContent = currentUsername + (isAdmin ? " (admin)" : "");
  settingsStatus.textContent = "Saved.";
});

// ---- Messages ----
function startMessageListener() {
  const q = query(collection(db, "messages"), orderBy("timestamp", "desc"), limit(100));
  onSnapshot(q, (snap) => {
    const docs = snap.docs.slice().reverse(); // oldest first
    messagesEl.innerHTML = "";
    docs.forEach((d) => renderMessage(d.id, d.data()));
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });
}

function renderMessage(id, data) {
  const div = document.createElement("div");
  div.className = "msg" + (data.uid === currentUser.uid ? " mine" : "");

  const time = data.timestamp?.toDate
    ? data.timestamp.toDate().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
    : "";

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.innerHTML = `<b>${escapeHtml(data.username || "unknown")}</b> ${time}`;
  div.appendChild(meta);

  const text = document.createElement("div");
  text.className = "text";
  text.textContent = data.text || "";
  div.appendChild(text);

  if (isAdmin) {
    const controls = document.createElement("div");
    controls.className = "admin-controls";

    const delBtn = document.createElement("button");
    delBtn.textContent = "Delete";
    delBtn.addEventListener("click", () => deleteMessage(id));
    controls.appendChild(delBtn);

    if (data.uid !== currentUser.uid) {
      const banBtn = document.createElement("button");
      banBtn.textContent = "Ban";
      banBtn.addEventListener("click", () => banUser(data.uid, data.username));
      controls.appendChild(banBtn);
    }

    div.appendChild(controls);
  }

  messagesEl.appendChild(div);
}

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

async function deleteMessage(id) {
  if (!confirm("Delete this message?")) return;
  await deleteDoc(doc(db, "messages", id));
}

async function banUser(targetUid, targetUsername) {
  const reason = prompt(`Ban ${targetUsername || "this user"}. Reason:`);
  if (reason === null) return; // cancelled
  if (!reason.trim()) {
    alert("A reason is required to ban.");
    return;
  }
  await setDoc(doc(db, "bans", targetUid), {
    username: targetUsername || null,
    reason: reason.trim(),
    bannedBy: currentUser.email,
    bannedAt: serverTimestamp(),
  });
  alert(`${targetUsername || "User"} has been banned.`);
}

composeForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = msgInput.value.trim();
  if (!text || !currentUser) return;
  msgInput.value = "";
  await addDoc(collection(db, "messages"), {
    uid: currentUser.uid,
    username: currentUsername,
    text,
    timestamp: serverTimestamp(),
  });
});
</script>

</body>
</html>
