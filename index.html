
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Room - Discontinued</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f2f2f2;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      width: 320px;
      padding: 25px;
      border-radius: 10px;
      text-align: center;
      box-sizing: border-box;
    }

    h2 {
      margin-top: 0;
      color: #333;
    }

    p {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .notice {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 6px;
      margin: 18px 0;
    }

    a {
      display: block;
      background: #4285f4;
      color: white;
      text-decoration: none;
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      margin-top: 15px;
    }

    a:hover {
      background: #3367d6;
    }

    .footer {
      font-size: 11px;
      color: #aaa;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Chat Room</h2>

    <div class="notice">
      <strong>Discontinued</strong>
      <p>
        Chat Room is no longer being developed or maintained.
        Thank you to everyone who used it!
      </p>
    </div>

    <p>
      Looking for another project?
      PyChat is a separate, independent project with its own development and goals.
    </p>

    <a href="https://roadkiill.github.io/PyChat/">
      Visit PyChat
    </a>

    <div class="footer">
      Chat Room · Discontinued
    </div>
  </div>
</body>
</html>
