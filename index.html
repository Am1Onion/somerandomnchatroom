<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat - Sign In</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #f2f2f2;
  }
  .box {
    background: #fff;
    border: 1px solid #ccc;
    padding: 24px;
    width: 320px;
    text-align: center;
  }
  button, input {
    font-size: 15px;
    padding: 8px;
    width: 100%;
    margin-top: 10px;
  }
  button {
    cursor: pointer;
  }
  #status {
    margin-top: 10px;
    font-size: 13px;
    color: #666;
    min-height: 16px;
  }
  #username-step {
    display: none;
  }
</style>
</head>
<body>

<div class="box">
  <h2>Chat Room</h2>

  <div id="login-step">
    <button id="google-btn">Sign in with Google</button>
  </div>

  <div id="username-step">
    <p>Pick a username to finish setting up your account.</p>
    <input id="username-input" type="text" placeholder="username" maxlength="20">
    <button id="save-username-btn">Continue</button>
  </div>

  <div id="status"></div>
</div>

<script type="module">
import { auth, db, googleProvider, ADMIN_EMAIL } from "./firebase-config.js";
import {
  signInWithPopup,
  onAuthStateChanged,
  signOut,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  doc,
  getDoc,
  setDoc,
  collection,
  query,
  where,
  getDocs,
  serverTimestamp,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const loginStep = document.getElementById("login-step");
const usernameStep = document.getElementById("username-step");
const statusEl = document.getElementById("status");
const googleBtn = document.getElementById("google-btn");
const usernameInput = document.getElementById("username-input");
const saveUsernameBtn = document.getElementById("save-username-btn");

function setStatus(msg) {
  statusEl.textContent = msg || "";
}

googleBtn.addEventListener("click", async () => {
  setStatus("Signing in...");
  try {
    await signInWithPopup(auth, googleProvider);
  } catch (err) {
    console.error(err);
    setStatus("Sign-in failed: " + err.message);
  }
});

saveUsernameBtn.addEventListener("click", async () => {
  const user = auth.currentUser;
  if (!user) return;
  const name = usernameInput.value.trim();

  if (!/^[a-zA-Z0-9_]{3,20}$/.test(name)) {
    setStatus("Username must be 3-20 characters: letters, numbers, underscores only.");
    return;
  }

  setStatus("Checking username...");
  const q = query(collection(db, "users"), where("username", "==", name));
  const snap = await getDocs(q);
  const taken = snap.docs.some((d) => d.id !== user.uid);
  if (taken) {
    setStatus("That username is already taken.");
    return;
  }

  setStatus("Saving...");
  await setDoc(doc(db, "users", user.uid), {
    uid: user.uid,
    email: user.email,
    username: name,
    createdAt: serverTimestamp(),
  });

  window.location.href = "chat.html";
});

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    loginStep.style.display = "block";
    usernameStep.style.display = "none";
    setStatus("");
    return;
  }

  setStatus("Checking your account...");

  // Banned check (skip for the admin account entirely)
  if (user.email !== ADMIN_EMAIL) {
    const banSnap = await getDoc(doc(db, "bans", user.uid));
    if (banSnap.exists()) {
      window.location.href = "banned.html";
      return;
    }
  }

  // Username check
  const userSnap = await getDoc(doc(db, "users", user.uid));
  if (userSnap.exists() && userSnap.data().username) {
    window.location.href = "chat.html";
    return;
  }

  // Needs to pick a username
  loginStep.style.display = "none";
  usernameStep.style.display = "block";
  setStatus("");
});
</script>

</body>
</html>
